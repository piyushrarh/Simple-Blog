<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Simple Blog</h1>

    <div class="post-form">

        <textarea id="contentInput" placeholder="Write your post here..."></textarea>

        <button id="addPostBtn">Add Post</button>
    </div>

    <hr>

    <div id="postsContainer"></div>

    <script src="script.js"></script>
</body>
</html>
